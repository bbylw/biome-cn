<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../node_modules/@fontsource-variable/space-grotesk/index.css" />
<link rel="stylesheet" href="../node_modules/@fontsource-variable/ibm-plex-sans/index.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css" />
<style>
  :root {
    --paper: #0a0e14; --surface: #111823; --ink: #e8eef6; --muted: #8593a5; --line: #22303f;
    --glow-1: #60a5fa; --glow-2: #a60ee5; --brand-1: #7db3ff; --brand-2: #c79bff;
    --lane-fmt: #74b0ff; --lane-lint: #b98cff; --lane-assist: #45d3a8;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-body); position: relative; }
  .wash { position: absolute; inset: -30% -10% auto -10%; height: 120%;
    background: radial-gradient(50% 60% at 84% 6%, rgba(166,14,229,.30), transparent 68%),
                radial-gradient(46% 56% at 8% 0%, rgba(96,165,250,.28), transparent 70%); }
  .wrap { position: relative; padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-size: 26px; font-weight: 600; }
  .brand span.sub { font-family: var(--font-body); font-size: 17px; font-weight: 400; color: var(--muted); border-left: 1px solid var(--line); padding-left: 14px; margin-left: 4px; }
  h1 { margin-top: 50px; font-family: var(--font-display); font-size: 68px; line-height: 1.1; letter-spacing: -.035em; max-width: 19ch; }
  h1 em { font-style: normal; background: linear-gradient(96deg, var(--brand-1), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 26px; font-size: 26px; color: #b7c2d1; max-width: 34ch; line-height: 1.5; }
  .lanes { margin-top: auto; display: flex; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 19px; color: var(--muted); }
  .lane { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); }
  .lane i { width: 10px; height: 10px; border-radius: 3px; display: block; }
  .f i { background: var(--lane-fmt); } .l i { background: var(--lane-lint); } .a i { background: var(--lane-assist); }
  .strata { position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, var(--lane-fmt) 0 22%, var(--lane-lint) 22% 55%, var(--lane-assist) 55% 80%, transparent 80%); }
  .cmd { position: absolute; right: 72px; bottom: 74px; font-family: var(--font-mono); font-size: 21px; color: var(--brand-1); background: #0d141d; border: 1px solid var(--line); padding: 12px 22px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="wrap">
    <div class="brand">
      <svg width="26" height="33" viewBox="4.6 5 96.2 122.7" aria-hidden="true">
        <path d="M30 44.2L52.6 5H7.3zM4.6 88.5h45.3L27.2 49.4zm51 0l22.6 39.2 22.6-39.2z" fill="#c160ef"/>
        <path d="M52.6 5L30 44.2h45.2zM27.2 49.4l22.7 39.1 22.6-39.1zm51 0L55.6 88.5h45.2z" fill="#a60ee5"/>
      </svg>
      Biome<span class="sub">45 篇中文文档</span>
    </div>
    <h1>一条命令，<em>跑完</em>格式化与 Lint</h1>
    <p>Rust 编写的 Web 工具链。与 Prettier 兼容度 97%，收录 545 条 Lint 规则。</p>
    <div class="lanes">
      <span class="lane f"><i></i>格式化</span>
      <span class="lane l"><i></i>Lint</span>
      <span class="lane a"><i></i>Assist</span>
    </div>
  </div>
  <div class="cmd">$ biome check --write ./src</div>
  <div class="strata"></div>
</body>
</html>
